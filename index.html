<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Brandex.pk — Consultants Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar / Mobile Nav -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">B</span>
          <div>
            <h1>Brandex.pk</h1>
            <p>Consultants Ledger</p>
          </div>
        </div>
        <button id="closeSidebar" class="icon-btn mobile-only" aria-label="Close menu">✕</button>
      </div>

      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search ledger / name..." autocomplete="off" />
      </div>

      <div class="sidebar-stats">
        <div class="stat">
          <span class="stat-label">Total Balance</span>
          <span class="stat-value" id="totalBalance">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Active Ledgers</span>
          <span class="stat-value" id="ledgerCount">—</span>
        </div>
      </div>

      <nav id="ledgerList" class="ledger-list"></nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <button id="openSidebar" class="icon-btn mobile-only" aria-label="Open menu">☰</button>
        <div class="topbar-title">
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle">All consultants overview</p>
        </div>
        <div class="topbar-actions">
          <button id="printBtn" class="btn btn-secondary" title="Print Preview">
            <span>🖨️</span> <span class="btn-text">Print</span>
          </button>
          <button id="homeBtn" class="btn btn-primary">Dashboard</button>
        </div>
      </header>

      <!-- Dashboard View -->
      <section id="dashboardView" class="view active">
        <div class="cards-grid" id="dashboardCards"></div>
        <div class="table-wrap">
          <table class="data-table" id="dashboardTable">
            <thead>
              <tr>
                <th>Ledger No</th>
                <th>Name</th>
                <th class="num">Balance</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Ledger Detail View -->
      <section id="ledgerView" class="view">
        <div class="ledger-header-card" id="ledgerHeader"></div>
        <div class="table-wrap ledger-table-wrap">
          <table class="data-table ledger-table" id="ledgerTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Folder No</th>
                <th>Stage</th>
                <th>TM No</th>
                <th>Details</th>
                <th class="num">Due</th>
                <th class="num">Received</th>
                <th class="num">Balance</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Print styles handled in CSS -->
  <script src="app.js"></script>
</body>
</html>
