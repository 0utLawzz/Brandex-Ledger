<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandex Ledger — Loading</title>
<style>
body{margin:0;background:#0a0c0f;color:#e6edf3;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
.spinner{width:40px;height:40px;border:3px solid #2a2f3a;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p>Loading Brandex Ledger...</p>
</div>
<script>
(async function() {
  try {
    const parts = await Promise.all([
      fetch('part0.htmlfrag').then(r => r.text()),
      fetch('part1.htmlfrag').then(r => r.text()),
      fetch('part2.htmlfrag').then(r => r.text()),
      fetch('part3.htmlfrag').then(r => r.text()).catch(() => '')
    ]);
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><h2>Load failed</h2><p>' + e.message + '</p><p><a href="https://github.com/0utLawzz/Brandex-Ledger" style="color:#58a6ff">GitHub</a></p></div>';
  }
})();
</script>
</body>
</html>
